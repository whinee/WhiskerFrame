name: CI

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff mypy pydantic

      - name: Run Ruff Linter
        run: ruff check whiskerframe/

      - name: Run Ruff Formatter Check
        run: ruff format --check whiskerframe/

      - name: Run Mypy Type Checker
        run: mypy whiskerframe

  unit-and-property-tests:
    name: Pytest & Hypothesis Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[preview,serial] pytest hypothesis pydantic pyyaml pyfiglet pillow python-dotenv esptool

      - name: Execute Pytest Suite
        run: pytest -v

  security-audit:
    name: Automated Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run Security Verification Script
        run: |
          pip install pyyaml
          python scripts/verify_security_audit.py

  typography-and-benchmarks:
    name: Typography & Transport Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e . pillow

      - name: Verify Font Compilation
        run: python scripts/verify_comic_mono_fonts.py

      - name: Benchmark Transport Rates
        run: python scripts/benchmark_transport.py

  acceptance-tests:
    name: Master Acceptance Suite (ATP-01..13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[preview,serial] pytest hypothesis pydantic pyyaml pyfiglet pillow python-dotenv esptool

      - name: Run Master Acceptance Test Runner
        run: python scripts/run_all_acceptance_tests.py

  build-and-packaging:
    name: Build & Artifact Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build uv

      - name: Build Python Distribution (sdist & wheel)
        run: uv build || python -m build

      - name: Verify Firmware Release Manifest Dry-Run
        run: |
          pip install python-dotenv pyyaml esptool
          python scripts/flash_cyd_display_link.py --dry-run
