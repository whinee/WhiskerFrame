# Cyberdeck / whiskerframe project configuration (committed, non-secret).
#
# Hardware facts and component lists that must stay reproducible live here rather
# than hard-coded in scripts. Loaded via scripts/config.py.

# Components verified on the Pi host by scripts/pi_env_check.py (Req 6.2).
components:
  - python3
  - pip
  - pyserial

# UPS Module 3S battery monitor (Texas Instruments INA219 over I2C).
ups:
  chip: INA219
  i2c_bus: 1                 # /dev/i2c-1 (Pi GPIO 2/3, physical pins 3/5)
  i2c_address: 0x41          # detected on this build (i2cdetect -y 1 -> 41)
  cells_series: 3            # 3S pack (3x 18650)
  voltage_full: 12.6         # volts at 100%
  voltage_empty: 9.0         # volts at 0%
  shunt_ohms: 0.1
  low_battery_percent: 15    # daemon warning threshold
  critical_percent: 5        # daemon critical/shutdown threshold
  poll_interval_seconds: 10  # battery daemon poll cadence (seconds)
  auto_shutdown: true        # power off cleanly at critical_percent (5%) to protect the pack
  power_supply_name: cyberdeck_ups  # POWER_SUPPLY_NAME published to the kernel class

# M5Stack CardKB keyboard (I2C0 on Pi GPIO 0/1, physical pins 27/28).
cardkb:
  i2c_bus: 0                 # /dev/i2c-0 (enabled via dtparam=i2c_vc + dtoverlay=i2c0,pins_0_1)
  i2c_address: 0x5f          # detected (i2cdetect -y 0 -> 5f)
  poll_interval_seconds: 0.05  # key scan cadence

# CYD display link serial device.
cyd:
  usb_id: "1a86:7523"        # CH340 USB-serial bridge
  port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
  baud: 115200

# CYD terminal: piiiiink theme (WCAG AA on the blurple bg), geometry, login, splash.
terminal:
  serial_port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
  baud: 115200
  font_size: 2               # 1->53x30, 2->26x15, 3->17x10 (resizable at runtime)
  keyframe_interval_seconds: 30  # periodic full repaint (recover from CYD reset)
  shell: /bin/bash
  # piiiiink terminal palette as RGB565 (all >= 4.5:1 contrast on bg).
  theme:
    bg: 0x18C5             # blurple background  (#191a28)
    fg: 0xFD9C             # pink text           (#ffb3e6)
    cursor: 0x2EDF         # cyan cursor         (#2dd8ff)
    accent_pink: 0xFB7A    # (#ff6fd0)
    accent_purple: 0xBD5F  # (#b9a9ff)
    accent_blue: 0x8CDF    # (#8f98ff)
    # ANSI normal (0-7) then bright (8-15), RGB565, a11y-corrected.
    ansi:
      - 0x8C76  # 0 black  (#8a8fb0)
      - 0xFB4D  # 1 red    (#ff6b6b)
      - 0x4EB4  # 2 green  (#4fd6a0)
      - 0xFE8C  # 3 yellow (#ffd166)
      - 0x7D1F  # 4 blue   (#7aa2ff)
      - 0xFBFC  # 5 magenta(#ff7fe0)
      - 0x4F1F  # 6 cyan   (#4fe3ff)
      - 0xE73E  # 7 white  (#e6e6f0)
      - 0xB5BA  # 8  br black  (#b0b4d0)
      - 0xFC71  # 9  br red    (#ff8f8f)
      - 0x6F97  # 10 br green  (#6ff0bd)
      - 0xFF11  # 11 br yellow (#ffe08a)
      - 0xA61F  # 12 br blue   (#a6c0ff)
      - 0xFCFD  # 13 br magenta(#ff9fe9)
      - 0x877F  # 14 br cyan   (#86ecff)
      - 0xFFFF  # 15 br white  (#ffffff)
  # Login gate: do NOT boot straight to root. Pick a user, enter password
  # (echoed as asterisks), authenticated against the system (PAM/su). `logout`
  # returns to this screen.
  login:
    enabled: true
    users:                 # selectable at the login screen; auth is real system auth
      - root
      - neko
    password_mask: "*"
  # Boot splash image shown while the Pi comes up (before the login screen).
  splash:
    enabled: true
    image: assets/images/cess/Lyra and Dreanne Christmas Night Market.png
    rgb565: assets/images/cess/Lyra and Dreanne Christmas Night Market.rgb565  # pre-converted on the programmer; the Pi only reads this
