# Cyberdeck inventory. Infra params come from the gitignored .env (loaded via
# .envrc / direnv on the dev host) — NEVER hardcode host/user/key paths here.
[cyberdeck]
pi_zero ansible_host="{{ lookup('env', 'PI_HOST') }}" ansible_user="{{ lookup('env', 'PI_USER') }}" ansible_ssh_private_key_file="{{ lookup('env', 'DEFAULT_KEY_PATH') }}"

[cyberdeck:vars]
# Run Python on the Pi through the deterministic uv-managed target venv, never
# system python — keeps deps pinned and memory overhead minimal on the Pi Zero.
ansible_python_interpreter="{{ lookup('env', 'DEFAULT_VENV_PATH') }}/bin/python"
