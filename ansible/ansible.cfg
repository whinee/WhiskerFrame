# Ansible config for the cyberdeck deploy layer.
# Runs from the dev host, targets the Pi Zero 2W over SSH.
[defaults]
inventory = ./inventory.ini
retry_files_enabled = False
stdout_callback = yaml
# Deterministic fact gathering; keep it light for the Pi Zero's limited RAM.
gathering = smart
interpreter_python = auto_silent
# Overridable at runtime: ANSIBLE_HOST_KEY_CHECKING=False for first contact.
host_key_checking = True
# Decrypts host_vars/*/vault.yml. The password file lives outside the repo
# (chmod 600) and is never committed.
vault_password_file = ~/.config/whiskerframe/vault-pass

[ssh_connection]
pipelining = True
