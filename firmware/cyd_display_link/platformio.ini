; PlatformIO project for CYD Display Link firmware.
;
; Target: Cheap Yellow Display (CYD) — ESP32 dev board with an ILI9341 TFT.
; Framework: Arduino. Display driver: TFT_eSPI.
;
; frame.h (this task, 15.1) is a header-only decoder and builds without any
; hardware. render.h (15.3/15.4) and main.cpp (15.5) are added by later tasks;
; the src_dir below already points at this sketch directory so they compile in
; place once present.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
; TFT_eSPI is configured for the CYD (ILI9341, 320x240) via build flags. These
; mirror the common CYD pinout; adjust if a board revision differs.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
